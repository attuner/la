<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Serverless P2P Audio Intercom</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(23, 32, 54, 0.75);
      --border: rgba(255, 255, 255, 0.08);
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --accent-glow: rgba(59, 130, 246, 0.4);
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --success: #10b981;
      --warning: #f59e0b;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font);
      background: radial-gradient(circle at 50% 10%, #172554, var(--bg) 80%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 1.75rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    header {
      text-align: center;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    header p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    /* Status Pill */
    .status-wrapper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.3);
      padding: 0.75rem 1rem;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--text-muted);
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    .status-dot.connecting {
      background: var(--warning);
      box-shadow: 0 0 10px var(--warning);
    }

    .status-dot.connected {
      background: var(--success);
      box-shadow: 0 0 10px var(--success);
    }

    .status-dot.error {
      background: var(--danger);
      box-shadow: 0 0 10px var(--danger);
    }

    .client-id {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: monospace;
    }

    /* Controls & Forms */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    label {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    input[type="text"] {
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.85rem 1rem;
      border-radius: 12px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    .button-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    button {
      font-family: var(--font);
      font-size: 0.95rem;
      font-weight: 600;
      padding: 0.85rem 1rem;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .btn-danger {
      background: var(--danger);
      color: white;
    }

    .btn-danger:hover:not(:disabled) {
      background: var(--danger-hover);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
    }

    .btn-secondary:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.18);
    }

    /* Audio Visualizer */
    .visualizer-container {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      border-radius: 14px;
      height: 70px;
      width: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    canvas {
      width: 100%;
      height: 100%;
    }

    /* Diagnostics Log Drawer */
    .log-container {
      background: #060911;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.75rem;
      font-family: monospace;
      font-size: 0.75rem;
      height: 100px;
      overflow-y: auto;
      color: #7dd3fc;
      line-height: 1.4;
    }

    .log-container p {
      margin-bottom: 2px;
      word-break: break-all;
    }

    .log-container p.err {
      color: #f87171;
    }

    .log-container p.warn {
      color: #fbbf24;
    }

    /* Hidden elements */
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🎙️ P2P Intercom</h1>
      <p>Low-Latency Direct Peer-to-Peer Audio</p>
    </header>

    <!-- Status Bar -->
    <div class="status-wrapper">
      <div class="status-badge">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusLabel">Disconnected</span>
      </div>
      <span class="client-id" id="peerIdDisplay">ID: ------</span>
    </div>

    <!-- Pre-Call Setup Form -->
    <div id="setupForm" class="form-group">
      <label for="roomInput">Room Name</label>
      <input type="text" id="roomInput" placeholder="e.g. kitchen-room" value="live-test" />
      
      <div class="button-group" style="margin-top: 0.5rem;">
        <button id="btnJoinHost" class="btn-primary">
          <span>Host (Offer)</span>
        </button>
        <button id="btnJoinGuest" class="btn-secondary">
          <span>Join (Answer)</span>
        </button>
      </div>
    </div>

    <!-- Active Call UI -->
    <div id="callControls" class="form-group hidden">
      <div class="visualizer-container">
        <canvas id="visualizer"></canvas>
      </div>

      <div class="button-group">
        <button id="btnMute" class="btn-secondary">
          <span id="muteLabel">Mute Mic</span>
        </button>
        <button id="btnHangup" class="btn-danger">
          <span>End Call</span>
        </button>
      </div>
    </div>

    <!-- Live Diagnostics Log Box -->
    <div class="form-group">
      <label>Connection Logs</label>
      <div class="log-container" id="logBox"></div>
    </div>
  </div>

  <!-- Audio Element (playsinline handles Safari/iOS policies) -->
  <audio id="remoteAudio" autoplay playsinline></audio>

  <script>
    /**
     * CONFIGURATION
     * Replace with your deployed Google Apps Script Web App URL
     */
    const SIGNALING_URL = "https://script.google.com/macros/s/AKfycbzyn1l0hNm63RPVCN0iJD-vkW73qP-xzn6qHQOZ3agRWQdaBSm5LU66DVNGWv_D4fN5/exec";

    // STUN Servers provided free by Google
    const RTC_CONFIG = {
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "stun:stun1.l.google.com:19302" }
      ]
    };

    // State Variables
    const peerId = "usr_" + Math.random().toString(36).substring(2, 9);
    let roomId = "";
    let isInitiator = false;
    let peerConnection = null;
    let localStream = null;
    let pollingInterval = null;
    let lastPollTimestamp = 0;
    let isMuted = false;
    let audioContext = null;
    let animationId = null;

    // DOM Elements
    const statusDot = document.getElementById("statusDot");
    const statusLabel = document.getElementById("statusLabel");
    const peerIdDisplay = document.getElementById("peerIdDisplay");
    const setupForm = document.getElementById("setupForm");
    const callControls = document.getElementById("callControls");
    const roomInput = document.getElementById("roomInput");
    const btnJoinHost = document.getElementById("btnJoinHost");
    const btnJoinGuest = document.getElementById("btnJoinGuest");
    const btnMute = document.getElementById("btnMute");
    const btnHangup = document.getElementById("btnHangup");
    const muteLabel = document.getElementById("muteLabel");
    const logBox = document.getElementById("logBox");
    const canvas = document.getElementById("visualizer");
    const canvasCtx = canvas.getContext("2d");
    const remoteAudio = document.getElementById("remoteAudio");

    peerIdDisplay.innerText = `ID: ${peerId}`;

    // Append diagnostics to the screen
    function log(msg, type = "info") {
      const p = document.createElement("p");
      p.className = type;
      p.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      logBox.appendChild(p);
      logBox.scrollTop = logBox.scrollHeight;
    }

    function setStatus(text, statusClass) {
      statusLabel.textContent = text;
      statusDot.className = `status-dot ${statusClass}`;
    }

    /**
     * iOS Safari Audio Unlock
     * Requires explicit AudioContext activation & element priming on user click
     */
    function unlockAudioForSafari() {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!audioContext && AudioCtx) {
        audioContext = new AudioCtx();
      }
      if (audioContext && audioContext.state === "suspended") {
        audioContext.resume();
      }
      // Play a short silent buffer to register active sound playback gesture
      remoteAudio.play().then(() => {
        remoteAudio.pause();
        remoteAudio.currentTime = 0;
      }).catch(() => {
        // Expected if track is not yet assigned; gesture is registered regardless
      });
    }

    /**
     * Setup Audio Capture & Canvas Visualizer
     */
    async function startMicrophone() {
      // Modern constraints prioritized for speech and low delay
      const constraints = {
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true,
          latency: 0
        },
        video: false
      };

      try {
        localStream = await navigator.mediaDevices.getUserMedia(constraints);
        log("Microphone access authorized.");
        setupVisualizer(localStream);
        return true;
      } catch (err) {
        log(`Microphone Error: ${err.message}`, "err");
        alert("Could not access microphone. Ensure permissions are granted and page is on HTTPS.");
        return false;
      }
    }

    function setupVisualizer(stream) {
      if (!audioContext) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        audioContext = new AudioCtx();
      }
      
      const source = audioContext.createMediaStreamSource(stream);
      const analyser = audioContext.createAnalyser();
      analyser.fftSize = 64;
      source.connect(analyser);

      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);

      function draw() {
        animationId = requestAnimationFrame(draw);
        analyser.getByteFrequencyData(dataArray);

        canvas.width = canvas.parentElement.offsetWidth;
        canvas.height = canvas.parentElement.offsetHeight;

        canvasCtx.fillStyle = "rgba(6, 9, 17, 0.5)";
        canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

        const barWidth = (canvas.width / bufferLength) * 2;
        let x = 0;

        for (let i = 0; i < bufferLength; i++) {
          const barHeight = (dataArray[i] / 255) * canvas.height;
          canvasCtx.fillStyle = `rgb(59, ${130 + dataArray[i] / 2}, 246)`;
          canvasCtx.fillRect(x, canvas.height - barHeight, barWidth - 2, barHeight);
          x += barWidth;
        }
      }
      draw();
    }

    /**
     * Google Apps Script Mailbox Signaling
     */
    async function sendSignal(type, payload, targetId = "all") {
      try {
        await fetch(SIGNALING_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "send",
            roomId: roomId,
            senderId: peerId,
            targetId: targetId,
            type: type,
            payload: payload
          }),
          redirect: "follow"
        });
      } catch (err) {
        log(`Failed to send ${type}: ${err.message}`, "err");
      }
    }

    function startSignalingPolling() {
      // Poll every 1200ms during initial handshake
      pollingInterval = setInterval(async () => {
        try {
          const url = `${SIGNALING_URL}?action=poll&roomId=${encodeURIComponent(roomId)}&peerId=${encodeURIComponent(peerId)}&since=${lastPollTimestamp}`;
          const res = await fetch(url, { method: "GET", redirect: "follow" });
          const data = await res.json();

          if (data.status === "success" && data.messages) {
            data.messages.forEach(msg => {
              handleIncomingSignal(msg);
              if (msg.timestamp > lastPollTimestamp) {
                lastPollTimestamp = msg.timestamp;
              }
            });
          }
        } catch (e) {
          // Suppress transient read failures during background polling
        }
      }, 1200);
    }

    function stopSignalingPolling() {
      if (pollingInterval) {
        clearInterval(pollingInterval);
        pollingInterval = null;
      }
    }

    /**
     * WebRTC Connection Setup
     */
    function createPeerConnection() {
      peerConnection = new RTCPeerConnection(RTC_CONFIG);

      // Add local audio tracks to peer connection
      localStream.getAudioTracks().forEach(track => {
        peerConnection.addTrack(track, localStream);
      });

      // Handle candidate exchange
      peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
          sendSignal("candidate", event.candidate);
        }
      };

      // Handle remote audio stream arrival
      peerConnection.ontrack = (event) => {
        log("Direct audio stream received from peer.");
        remoteAudio.srcObject = event.streams[0];
        remoteAudio.play().catch(e => {
          log(`Autoplay blocked: ${e.message}. Tap screen to unlock.`, "warn");
        });
      };

      // Handle connection status changes
      peerConnection.oniceconnectionstatechange = () => {
        const state = peerConnection.iceConnectionState;
        log(`ICE State: ${state}`);
        if (state === "connected" || state === "completed") {
          setStatus("Connected (P2P)", "connected");
          // Turn off signaling mailbox polling once direct P2P is established to save sheet bandwidth
          stopSignalingPolling();
        } else if (state === "disconnected" || state === "failed" || state === "closed") {
          setStatus("Disconnected", "error");
        } else if (state === "checking") {
          setStatus("Verifying P2P...", "connecting");
        }
      };
    }

    /**
     * Signal Dispatcher
     */
    async function handleIncomingSignal(msg) {
      const { type, payload } = msg;

      if (!peerConnection && type !== "offer" && type !== "join") return;

      try {
        if (type === "join" && isInitiator) {
          log("Peer entered the room. Building offer...");
          const offer = await peerConnection.createOffer({
            offerToReceiveAudio: true,
            voiceActivityDetection: true
          });
          await peerConnection.setLocalDescription(offer);
          await sendSignal("offer", offer);
        } 
        else if (type === "offer" && !isInitiator) {
          log("Offer received. Replying with answer...");
          await peerConnection.setRemoteDescription(new RTCSessionDescription(payload));
          const answer = await peerConnection.createAnswer();
          await peerConnection.setLocalDescription(answer);
          await sendSignal("answer", answer);
        } 
        else if (type === "answer" && isInitiator) {
          log("Answer received from peer.");
          if (peerConnection.signalingState !== "stable") {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(payload));
          }
        } 
        else if (type === "candidate") {
          if (payload && peerConnection) {
            await peerConnection.addIceCandidate(new RTCIceCandidate(payload));
          }
        }
      } catch (err) {
        log(`Signal handling error: ${err.message}`, "err");
      }
    }

    /**
     * Start Call Orchestration
     */
    async function initiateCall(asHost) {
      unlockAudioForSafari();
      roomId = roomInput.value.trim().toLowerCase();

      if (!roomId) {
        alert("Please specify a valid Room Name.");
        return;
      }

      if (SIGNALING_URL.includes("YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL")) {
        alert("Error: Update SIGNALING_URL in the script tag with your deployed Apps Script URL.");
        return;
      }

      const micGranted = await startMicrophone();
      if (!micGranted) return;

      isInitiator = asHost;
      setupForm.classList.add("hidden");
      callControls.classList.remove("hidden");
      setStatus("Signaling...", "connecting");

      createPeerConnection();
      lastPollTimestamp = Date.now();
      startSignalingPolling();

      if (isInitiator) {
        log(`Hosting room "${roomId}". Waiting for peer...`);
      } else {
        log(`Joining room "${roomId}" as guest...`);
        // Notify host that guest has joined
        await sendSignal("join", { ready: true });
      }
    }

    // Call End / Teardown
    function hangUp() {
      stopSignalingPolling();

      if (animationId) cancelAnimationFrame(animationId);

      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }

      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }

      remoteAudio.srcObject = null;
      setStatus("Disconnected", "");
      setupForm.classList.remove("hidden");
      callControls.classList.add("hidden");
      log("Call terminated.");
    }

    // Toggle Mic Mute
    function toggleMute() {
      if (!localStream) return;
      isMuted = !isMuted;
      localStream.getAudioTracks().forEach(track => {
        track.enabled = !isMuted;
      });
      muteLabel.innerText = isMuted ? "Unmute Mic" : "Mute Mic";
      btnMute.className = isMuted ? "btn-danger" : "btn-secondary";
      log(`Microphone ${isMuted ? "Muted" : "Active"}`);
    }

    // Event Listeners
    btnJoinHost.addEventListener("click", () => initiateCall(true));
    btnJoinGuest.addEventListener("click", () => initiateCall(false));
    btnHangup.addEventListener("click", hangUp);
    btnMute.addEventListener("click", toggleMute);

    // Visibility management (re-awakens WebRTC streams on mobile tab change)
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && audioContext && audioContext.state === "suspended") {
        audioContext.resume();
      }
    });
  </script>
</body>
</html>
