<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>CloudRadio — Live Web Audio</title>
  <style>
    :root {
      --bg: #090b10;
      --card-bg: rgba(22, 27, 34, 0.7);
      --border: rgba(255, 255, 255, 0.1);
      --primary: #00f2fe;
      --accent: #4facfe;
      --live: #ff0844;
      --text: #f0f6fc;
      --text-muted: #8b949e;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background-color: var(--bg);
      background-image: radial-gradient(circle at 50% 0%, #1a233a 0%, var(--bg) 75%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    header {
      width: 100%;
      max-width: 600px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .brand { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.5px; display: flex; align-items: center; gap: 8px; }
    .brand-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 10px var(--primary); }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
    }
    .status-badge.live { background: rgba(255, 8, 68, 0.15); border-color: var(--live); color: var(--live); }
    .status-badge.live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--live); box-shadow: 0 0 8px var(--live); animation: pulse 1.5s infinite; }

    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.85); } }

    .card {
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      margin-bottom: 20px;
    }

    .topic-display { margin-bottom: 20px; text-align: center; }
    .topic-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 6px; }
    .topic-sub { font-size: 0.85rem; color: var(--text-muted); }

    /* Canvas Visualizer */
    .vis-container {
      width: 100%;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 16px 0;
    }
    canvas { width: 100%; height: 100%; border-radius: 8px; }

    /* Buttons */
    .btn {
      width: 100%;
      min-height: 52px;
      border-radius: 26px;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
      touch-action: manipulation;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent) 0%, var(--primary) 100%);
      color: #050505;
      box-shadow: 0 4px 20px rgba(0, 242, 254, 0.3);
    }
    .btn-primary:active { transform: scale(0.98); }
    .btn-danger { background: var(--live); color: white; }

    /* Volume Slider */
    .volume-box { display: flex; align-items: center; gap: 12px; margin-top: 20px; }
    .volume-box input[type=range] {
      flex: 1;
      accent-color: var(--primary);
      height: 6px;
      cursor: pointer;
    }

    /* Shoutouts Chat Area */
    .shoutout-card { display: flex; flex-direction: column; height: 320px; }
    .shoutout-list { flex: 1; overflow-y: auto; padding-right: 6px; display: flex; flex-direction: column; gap: 10px; }
    .shoutout-item { background: rgba(255, 255, 255, 0.03); padding: 8px 12px; border-radius: 8px; font-size: 0.85rem; }
    .shoutout-meta { font-size: 0.75rem; color: var(--accent); font-weight: 600; margin-bottom: 2px; }
    .shoutout-form { display: flex; gap: 8px; margin-top: 14px; }
    .shoutout-form input {
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }
    .shoutout-form input:focus { border-color: var(--primary); }

    /* Broadcaster Section */
    #broadcasterPanel {
      border: 1px solid rgba(255, 8, 68, 0.3);
      display: none;
    }
    .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .admin-title { font-size: 0.9rem; font-weight: 700; color: var(--live); text-transform: uppercase; }

    .text-field {
      width: 100%;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 12px;
      outline: none;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand"><div class="brand-dot"></div>CloudRadio</div>
    <div id="liveBadge" class="status-badge">Checking...</div>
  </header>

  <!-- Broadcaster Control Panel -->
  <section id="broadcasterPanel" class="card">
    <div class="admin-header">
      <span class="admin-title">Broadcaster Console</span>
      <span id="activePeersCounter" style="font-size: 0.8rem; color: var(--text-muted);">0 Listeners</span>
    </div>
    <input type="text" id="streamTopicInput" class="text-field" placeholder="Broadcast Title / Topic..." />
    <button id="broadcastToggleBtn" class="btn btn-primary" onclick="toggleBroadcasting()">Go Live (Start Mic)</button>
    <div class="vis-container">
      <canvas id="hostVisualizer"></canvas>
    </div>
  </section>

  <!-- Public Listener Interface -->
  <main class="card">
    <div class="topic-display">
      <h1 id="streamTopic" class="topic-title">Connecting to Station...</h1>
      <p id="streamStatusDesc" class="topic-sub">Looking up live signals</p>
    </div>

    <div class="vis-container">
      <canvas id="listenerVisualizer"></canvas>
    </div>

    <button id="listenBtn" class="btn btn-primary" onclick="toggleListening()">Tune In (Listen Live)</button>

    <div class="volume-box">
      <span style="font-size: 0.8rem; color: var(--text-muted);">🔊</span>
      <input type="range" id="volumeControl" min="0" max="1" step="0.01" value="0.9" oninput="adjustVolume(this.value)" />
    </div>
  </main>

  <!-- Shoutouts Feed -->
  <section class="card shoutout-card">
    <div class="shoutout-list" id="shoutoutFeed"></div>
    <form class="shoutout-form" onsubmit="handleSendShoutout(event)">
      <input type="text" id="shoutoutName" placeholder="Your Name" style="width: 30%;" required maxlength="20" />
      <input type="text" id="shoutoutMsg" placeholder="Message or question..." style="flex: 1;" required maxlength="140" />
      <button class="btn btn-primary" style="min-height: auto; width: 60px; border-radius: 8px;">Send</button>
    </form>
  </section>

  <audio id="remoteAudioElement" autoplay playsinline style="display: none;"></audio>

  <script>
    /**
     * CONFIGURATION
     */
    const CONFIG = {
      // PASTE YOUR DEPLOYED GOOGLE APPS SCRIPT WEB APP URL HERE
      APP_SCRIPT_URL: "https://script.google.com/macros/s/AKfycbxGqG4sf8yHLBQvhcZMV0WzeCyjpQiG2pmGW7ZtDY-IAeog3ZclvTNpyST9znjJ88mM/exec",
      ADMIN_PIN: "1337", // Passcode for host authentication
      ICE_SERVERS: [{ urls: "stun:stun.l.google.com:19302" }],
      POLL_INTERVAL: 4000
    };

    // Client State
    const myPeerId = "peer_" + Math.random().toString(36).substring(2, 9);
    let isBroadcaster = false;
    let isBroadcasting = false;
    let isListening = false;
    let localStream = null;
    let audioCtx = null;
    let analyser = null;
    let visualizerFrameId = null;

    // WebRTC Storage
    const peerConnections = {}; // Broadcaster: peerId -> RTCPeerConnection
    let listenerConnection = null; // Listener: single RTCPeerConnection

    /**
     * Initialization & Authentication Check
     */
    window.addEventListener("DOMContentLoaded", () => {
      // Enable Host mode via Hash (#host) or PIN prompt
      if (window.location.hash === "#host") {
        const pin = prompt("Enter Studio Broadcaster PIN:");
        if (pin === CONFIG.ADMIN_PIN) {
          isBroadcaster = true;
          document.getElementById("broadcasterPanel").style.display = "block";
        } else {
          alert("Unauthorized passcode. Defaulting to Listener Mode.");
          window.location.hash = "";
        }
      }

      setupMediaSession();
      pollStationStatus();
      setInterval(pollStationStatus, CONFIG.POLL_INTERVAL);
    });

    /**
     * Google Apps Script HTTP Interface
     */
    async function apiRequest(action, method = "GET", body = null) {
      if (!CONFIG.APP_SCRIPT_URL || CONFIG.APP_SCRIPT_URL.includes("YOUR_SCRIPT_ID")) return null;
      try {
        let url = `${CONFIG.APP_SCRIPT_URL}?action=${action}&_t=${Date.now()}`;
        let options = { method: method };
        if (method === "POST" && body) {
          options.body = JSON.stringify(body);
        }
        const res = await fetch(url, options);
        return await res.json();
      } catch (err) {
        console.warn("GAS API Request Failed:", err);
        return null;
      }
    }

    /**
     * Station & Shoutouts Polling
     */
    async function pollStationStatus() {
      const data = await apiRequest("getStatus");
      if (!data || data.status !== "success") return;

      const { state, shoutouts } = data;
      const isLive = state.is_live === "TRUE" || state.is_live === true;

      // Update Header Badge
      const badge = document.getElementById("liveBadge");
      badge.textContent = isLive ? "LIVE" : "OFFLINE";
      badge.className = `status-badge ${isLive ? "live" : ""}`;

      // Update Stream Details
      document.getElementById("streamTopic").textContent = state.current_topic || "Station Idle";
      document.getElementById("streamStatusDesc").textContent = isLive 
        ? "On Air • High-Fidelity Audio Feed" 
        : "Off Air • Stand by for next broadcast";

      // Render Shoutouts
      renderShoutouts(shoutouts);

      // Broadcaster loop: Checks for listener join requests
      if (isBroadcaster && isBroadcasting) {
        pollBroadcasterSignals();
      }
    }

    function renderShoutouts(list) {
      const container = document.getElementById("shoutoutFeed");
      if (!list || list.length === 0) {
        container.innerHTML = `<div style="text-align:center;color:var(--text-muted);margin-top:60px;">No messages yet. Say hello!</div>`;
        return;
      }
      container.innerHTML = list.map(item => `
        <div class="shoutout-item">
          <div class="shoutout-meta">${escapeHtml(item.name)} • ${item.timestamp}</div>
          <div>${escapeHtml(item.message)}</div>
        </div>
      `).join('');
    }

    async function handleSendShoutout(e) {
      e.preventDefault();
      const nameInput = document.getElementById("shoutoutName");
      const msgInput = document.getElementById("shoutoutMsg");

      const payload = {
        action: "sendShoutout",
        name: nameInput.value.trim(),
        message: msgInput.value.trim()
      };

      msgInput.value = "";
      await apiRequest("sendShoutout", "POST", payload);
      pollStationStatus();
    }

    /**
     * BROADCASTER (HOST) ENGINE
     */
    async function toggleBroadcasting() {
      const btn = document.getElementById("broadcastToggleBtn");
      const topicInput = document.getElementById("streamTopicInput");

      if (!isBroadcasting) {
        try {
          localStream = await navigator.mediaDevices.getUserMedia({
            audio: {
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: true
            }
          });

          isBroadcasting = true;
          btn.textContent = "Stop Broadcast";
          btn.classList.add("btn-danger");

          attachVisualizer(localStream, "hostVisualizer");

          await apiRequest("setLiveState", "POST", {
            action: "setLiveState",
            isLive: true,
            topic: topicInput.value || "Live Radio Show"
          });
          pollStationStatus();
        } catch (err) {
          alert("Microphone Access Denied: " + err.message);
        }
      } else {
        // Stop Broadcasting
        if (localStream) {
          localStream.getTracks().forEach(track => track.stop());
        }
        Object.values(peerConnections).forEach(pc => pc.close());
        for (let p in peerConnections) delete peerConnections[p];

        isBroadcasting = false;
        btn.textContent = "Go Live (Start Mic)";
        btn.classList.remove("btn-danger");

        await apiRequest("setLiveState", "POST", {
          action: "setLiveState",
          isLive: false
        });
        pollStationStatus();
      }
    }

    async function pollBroadcasterSignals() {
      const res = await apiRequest(`getSignals&peerId=HOST`);
      if (!res || !res.signals) return;

      for (const sig of res.signals) {
        const listenerId = sig.from;

        if (sig.type === "listener-join") {
          // New listener joined: Establish RTCPeerConnection
          setupHostPeerConnection(listenerId);
        } else if (sig.type === "answer") {
          const pc = peerConnections[listenerId];
          if (pc) {
            await pc.setRemoteDescription(new RTCSessionDescription(sig.payload));
          }
        } else if (sig.type === "candidate") {
          const pc = peerConnections[listenerId];
          if (pc && sig.payload) {
            await pc.addIceCandidate(new RTCIceCandidate(sig.payload));
          }
        }
      }
    }

    async function setupHostPeerConnection(listenerId) {
      if (peerConnections[listenerId]) peerConnections[listenerId].close();

      const pc = new RTCPeerConnection({ iceServers: CONFIG.ICE_SERVERS });
      peerConnections[listenerId] = pc;

      // Add local audio tracks to peer connection
      localStream.getAudioTracks().forEach(track => pc.addTrack(track, localStream));

      pc.onicecandidate = (event) => {
        if (event.candidate) {
          apiRequest("sendSignal", "POST", {
            action: "sendSignal",
            from: "HOST",
            to: listenerId,
            type: "candidate",
            payload: event.candidate
          });
        }
      };

      pc.onconnectionstatechange = () => {
        updateActiveListenerCount();
      };

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);

      await apiRequest("sendSignal", "POST", {
        action: "sendSignal",
        from: "HOST",
        to: listenerId,
        type: "offer",
        payload: offer
      });
      updateActiveListenerCount();
    }

    function updateActiveListenerCount() {
      const active = Object.values(peerConnections).filter(pc => 
        pc.connectionState === 'connected' || pc.connectionState === 'connecting'
      ).length;
      document.getElementById("activePeersCounter").textContent = `${active} Listeners`;
    }

    /**
     * LISTENER ENGINE
     */
    async function toggleListening() {
      const btn = document.getElementById("listenBtn");
      const audioEl = document.getElementById("remoteAudioElement");

      if (!isListening) {
        initAudioContext();
        btn.textContent = "Connecting...";
        btn.disabled = true;

        listenerConnection = new RTCPeerConnection({ iceServers: CONFIG.ICE_SERVERS });

        listenerConnection.ontrack = (event) => {
          audioEl.srcObject = event.streams[0];
          audioEl.play().catch(e => console.warn("Autoplay block averted:", e));
          attachVisualizer(event.streams[0], "listenerVisualizer");
          btn.textContent = "Disconnect";
          btn.classList.add("btn-danger");
          btn.disabled = false;
          isListening = true;
          updateMediaSessionPlaybackState(true);
        };

        listenerConnection.onicecandidate = (event) => {
          if (event.candidate) {
            apiRequest("sendSignal", "POST", {
              action: "sendSignal",
              from: myPeerId,
              to: "HOST",
              type: "candidate",
              payload: event.candidate
            });
          }
        };

        // Notify Host of connection request
        await apiRequest("sendSignal", "POST", {
          action: "sendSignal",
          from: myPeerId,
          to: "HOST",
          type: "listener-join",
          payload: {}
        });

        // Listen for Host Offer
        listenForSignals();
      } else {
        disconnectListener();
      }
    }

    function disconnectListener() {
      const btn = document.getElementById("listenBtn");
      const audioEl = document.getElementById("remoteAudioElement");

      if (listenerConnection) listenerConnection.close();
      listenerConnection = null;
      audioEl.srcObject = null;
      isListening = false;

      btn.textContent = "Tune In (Listen Live)";
      btn.classList.remove("btn-danger");
      btn.disabled = false;
      updateMediaSessionPlaybackState(false);
    }

    async function listenForSignals() {
      if (!listenerConnection || isListening) return;

      const res = await apiRequest(`getSignals&peerId=${myPeerId}`);
      if (res && res.signals) {
        for (const sig of res.signals) {
          if (sig.type === "offer") {
            await listenerConnection.setRemoteDescription(new RTCSessionDescription(sig.payload));
            const answer = await listenerConnection.createAnswer();
            await listenerConnection.setLocalDescription(answer);

            await apiRequest("sendSignal", "POST", {
              action: "sendSignal",
              from: myPeerId,
              to: "HOST",
              type: "answer",
              payload: answer
            });
          } else if (sig.type === "candidate") {
            if (sig.payload) {
              await listenerConnection.addIceCandidate(new RTCIceCandidate(sig.payload));
            }
          }
        }
      }
      setTimeout(listenForSignals, 1500);
    }

    /**
     * AUDIO & VISUALIZATION PIPELINE
     */
    function initAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
    }

    function attachVisualizer(stream, canvasId) {
      initAudioContext();
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext("2d");
      
      const source = audioCtx.createMediaStreamSource(stream);
      const analyserNode = audioCtx.createAnalyser();
      analyserNode.fftSize = 64;
      source.connect(analyserNode);

      const bufferLength = analyserNode.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);

      function draw() {
        visualizerFrameId = requestAnimationFrame(draw);
        analyserNode.getByteFrequencyData(dataArray);

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const barWidth = (canvas.width / bufferLength) * 2;
        let x = 0;

        for (let i = 0; i < bufferLength; i++) {
          const barHeight = (dataArray[i] / 255) * canvas.height;
          ctx.fillStyle = `rgb(0, ${Math.min(255, dataArray[i] + 120)}, 254)`;
          ctx.fillRect(x, canvas.height - barHeight, barWidth - 2, barHeight);
          x += barWidth;
        }
      }
      draw();
    }

    function adjustVolume(val) {
      const audioEl = document.getElementById("remoteAudioElement");
      audioEl.volume = parseFloat(val);
    }

    /**
     * LOCK SCREEN / MEDIA SESSION API
     */
    function setupMediaSession() {
      if ("mediaSession" in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: "CloudRadio Live Broadcast",
          artist: "Live Voice Radio",
          album: "WebRTC Stream"
        });

        navigator.mediaSession.setActionHandler("play", () => {
          if (!isListening) toggleListening();
        });
        navigator.mediaSession.setActionHandler("pause", () => {
          if (isListening) toggleListening();
        });
        navigator.mediaSession.setActionHandler("stop", () => {
          if (isListening) toggleListening();
        });
      }
    }

    function updateMediaSessionPlaybackState(isPlaying) {
      if ("mediaSession" in navigator) {
        navigator.mediaSession.playbackState = isPlaying ? "playing" : "paused";
      }
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }
  </script>
</body>
</html>
