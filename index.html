<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>P2P Voice Switchboard</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --accent: #238636;
      --accent-hover: #2ea043;
      --danger: #da3633;
      --danger-hover: #f85149;
      --warn: #d29922;
      --text: #c9d1d9;
      --text-bright: #ffffff;
      --muted: #8b949e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .container { width: 100%; max-width: 520px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.6); }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    h1 { font-size: 1.2rem; font-weight: 600; color: var(--text-bright); }
    .status-badge { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; text-transform: uppercase; font-weight: 700; padding: 4px 8px; border-radius: 999px; background: #21262d; border: 1px solid var(--border); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #484f58; }
    .dot.signaling { background: var(--warn); animation: pulse 1s infinite alternate; }
    .dot.connecting { background: var(--warn); animation: pulse 0.5s infinite alternate; }
    .dot.live { background: #3fb950; box-shadow: 0 0 8px #3fb950; }
    @keyframes pulse { from { opacity: 0.3; } to { opacity: 1; } }

    .card { background: #0d1117; border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-bottom: 14px; }
    .group-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; font-weight: 600; }
    .flex-row { display: flex; gap: 8px; align-items: center; }
    
    input[type="text"], input[type="password"] { flex: 1; background: #161b22; border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; color: var(--text); font-size: 0.95rem; outline: none; }
    input[type="text"]:focus, input[type="password"]:focus { border-color: #58a6ff; }

    button { background: #21262d; border: 1px solid var(--border); color: var(--text-bright); padding: 10px 14px; border-radius: 6px; font-size: 0.85rem; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: background 0.15s ease; touch-action: manipulation; }
    button:hover:not(:disabled) { background: #30363d; }
    button.primary { background: var(--accent); border-color: rgba(255,255,255,0.1); }
    button.primary:hover:not(:disabled) { background: var(--accent-hover); }
    button.danger { background: var(--danger); border-color: rgba(255,255,255,0.1); }
    button.danger:hover:not(:disabled) { background: var(--danger-hover); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    .visualizer-container { height: 38px; width: 100%; display: flex; align-items: flex-end; gap: 3px; margin: 10px 0; background: #010409; padding: 5px; border-radius: 6px; }
    .visualizer-bar { flex: 1; background: #238636; min-height: 2px; height: 2px; border-radius: 2px; }

    .item-list { list-style: none; font-size: 0.85rem; color: var(--muted); max-height: 150px; overflow-y: auto; }
    .item-list li { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px dotted var(--border); }
    .item-list li:last-child { border-bottom: none; }
    
    .approval-banner { background: #2d2206; border: 1px solid var(--warn); padding: 10px 12px; border-radius: 6px; margin-bottom: 12px; font-size: 0.85rem; display: flex; justify-content: space-between; align-items: center; }
    .audio-fallback-btn { width: 100%; background: #1f6feb; border-color: #388bfd; margin-bottom: 12px; padding: 12px; font-weight: bold; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>P2P Voice Switchboard</h1>
    <div class="status-badge">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">Guest</span>
    </div>
  </header>

  <!-- Autoplay Fallback Activation Button -->
  <button id="audioUnlockBtn" class="audio-fallback-btn hidden">Tap to Enable & Listen to Audio</button>

  <!-- Auth Panel -->
  <div class="card" id="authSection">
    <div class="group-label">Authentication</div>
    <div class="flex-row" style="margin-bottom: 8px;">
      <input type="text" id="authUsername" placeholder="Username" autocapitalize="none" autocomplete="off" />
      <input type="password" id="authPassword" placeholder="Password" />
    </div>
    <div class="flex-row">
      <button class="primary" id="loginBtn" style="flex: 1;">Log In</button>
      <button id="registerBtn" style="flex: 1;">Register</button>
    </div>
  </div>

  <!-- App Controls -->
  <div id="appSection" class="hidden">
    <!-- Approval Notification Prompt -->
    <div id="incomingRequestContainer"></div>

    <!-- Broadcaster Section -->
    <div class="card">
      <div class="group-label">Broadcaster Deck</div>
      <div class="visualizer-container" id="visualizer"></div>
      <div class="flex-row">
        <button id="startBroadcastBtn" class="primary" style="flex: 1;">Go Live (Broadcast)</button>
        <button id="muteBtn" disabled>Mute</button>
        <button id="stopSessionBtn" class="danger" disabled>Stop</button>
      </div>
    </div>

    <!-- Live Directory -->
    <div class="card">
      <div class="group-label">Active Broadcasters</div>
      <ul class="item-list" id="broadcasterList">
        <li><span>No active broadcasts detected</span></li>
      </ul>
      <div style="margin-top: 8px; text-align: right;">
        <button id="refreshBroadcastsBtn" style="font-size: 0.75rem; padding: 4px 8px;">Refresh List</button>
      </div>
    </div>
  </div>
</div>

<!-- Cross-Platform HTML5 Audio Engine with explicit inline attributes -->
<audio id="remoteAudio" autoplay playsinline webkit-playsinline></audio>

<script>
  /**
   * CONFIGURATION
   * Paste your published Google Apps Script Web App URL below:
   */
  const GAS_SIGNALING_URL = "https://script.google.com/macros/s/AKfycbxluLFX60cKN1ydSvbeRKzXdr7ohjhpsPBLR65vEZtxLiPRImDH6M1jlENg3ab46Ww0/exec";

  const RTC_CONFIG = {
    iceServers: [
      { urls: "stun:stun.l.google.com:19302" },
      { urls: "stun:stun1.l.google.com:19302" }
    ]
  };

  // State Management
  let currentUser = sessionStorage.getItem("p2p_user") || "";
  let currentPass = sessionStorage.getItem("p2p_pass") || "";
  let currentRoomId = null;
  let activeRole = null; // 'broadcaster' | 'listener'
  let targetPeerUser = null;
  let activePeerConnection = null;
  let localAudioStream = null;
  let audioContext = null;
  let analyserNode = null;
  let animFrameId = null;
  let sessionTimer = null;
  let lastSyncTimestamp = 0;
  let isMuted = false;

  // ICE Candidate Queue to prevent unhandled race drops
  let iceCandidatesQueue = [];

  // Persistent reference to safeguard remote streams against mobile GC passes
  window.remoteStream = null;

  // DOM Handles
  const statusDot = document.getElementById("statusDot");
  const statusText = document.getElementById("statusText");
  const authSection = document.getElementById("authSection");
  const appSection = document.getElementById("appSection");
  const authUsername = document.getElementById("authUsername");
  const authPassword = document.getElementById("authPassword");
  const loginBtn = document.getElementById("loginBtn");
  const registerBtn = document.getElementById("registerBtn");
  const startBroadcastBtn = document.getElementById("startBroadcastBtn");
  const muteBtn = document.getElementById("muteBtn");
  const stopSessionBtn = document.getElementById("stopSessionBtn");
  const broadcasterList = document.getElementById("broadcasterList");
  const refreshBroadcastsBtn = document.getElementById("refreshBroadcastsBtn");
  const incomingRequestContainer = document.getElementById("incomingRequestContainer");
  const audioUnlockBtn = document.getElementById("audioUnlockBtn");
  const remoteAudio = document.getElementById("remoteAudio");
  const visualizerContainer = document.getElementById("visualizer");

  // Generate visualizer bars
  const NUM_BARS = 22;
  const bars = [];
  for (let i = 0; i < NUM_BARS; i++) {
    const b = document.createElement("div");
    b.className = "visualizer-bar";
    visualizerContainer.appendChild(b);
    bars.push(b);
  }

  function setStatus(state, text) {
    statusDot.className = "dot " + state;
    statusText.innerText = text;
  }

  // ==========================================
  // CROSS-PLATFORM USER-GESTURE AUDIO UNLOCKER
  // Must execute inside synchronous direct user tap
  // ==========================================
  function unlockAudioEngine() {
    if (!audioContext) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) audioContext = new AudioCtx();
    }
    if (audioContext && audioContext.state === "suspended") {
      audioContext.resume();
    }
    // Prime HTML5 Audio element to bypass WebKit autoplay security
    if (remoteAudio) {
      remoteAudio.play().catch(() => {});
    }
  }

  // ==========================================
  // RELIABLE URL-ENCODED SIGNALING CLIENT
  // ==========================================
  async function apiCall(action, payload = {}) {
    const body = {
      action,
      username: currentUser,
      password: currentPass,
      ...payload
    };

    const formData = new URLSearchParams();
    for (const key in body) {
      if (typeof body[key] === "object") {
        formData.append(key, JSON.stringify(body[key]));
      } else {
        formData.append(key, body[key] !== undefined ? body[key] : "");
      }
    }

    try {
      const res = await fetch(GAS_SIGNALING_URL, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: formData.toString()
      });
      return await res.json();
    } catch (err) {
      console.warn("Signaling Error:", err);
      return { status: "error", message: err.toString() };
    }
  }

  // ==========================================
  // AUTHENTICATION WORKFLOW
  // ==========================================
  registerBtn.onclick = async () => {
    unlockAudioEngine();
    const u = authUsername.value.trim();
    const p = authPassword.value;
    if (!u || !p) return alert("Enter both username and password.");
    registerBtn.disabled = true;
    const res = await apiCall("register", { username: u, password: p });
    registerBtn.disabled = false;
    alert(res.message);
  };

  loginBtn.onclick = async () => {
    unlockAudioEngine();
    const u = authUsername.value.trim();
    const p = authPassword.value;
    if (!u || !p) return alert("Enter both username and password.");
    loginBtn.disabled = true;
    const res = await apiCall("login", { username: u, password: p });
    loginBtn.disabled = false;

    if (res.status === "success") {
      currentUser = u.toLowerCase();
      currentPass = p;
      sessionStorage.setItem("p2p_user", currentUser);
      sessionStorage.setItem("p2p_pass", currentPass);
      initAppUI();
    } else {
      alert("Auth Failed: " + res.message);
    }
  };

  function initAppUI() {
    authSection.classList.add("hidden");
    appSection.classList.remove("hidden");
    setStatus("", currentUser);
    fetchBroadcasts();
  }

  if (currentUser && currentPass) {
    initAppUI();
  }

  // ==========================================
  // AUDIO CONTEXT & VISUALIZER
  // ==========================================
  function initVisualizer(stream) {
    if (!audioContext) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      audioContext = new AudioCtx();
    }
    if (audioContext.state === "suspended") {
      audioContext.resume();
    }

    analyserNode = audioContext.createAnalyser();
    analyserNode.fftSize = 64;
    const src = audioContext.createMediaStreamSource(stream);
    src.connect(analyserNode);

    const dataArray = new Uint8Array(analyserNode.frequencyBinCount);
    function render() {
      analyserNode.getByteFrequencyData(dataArray);
      for (let i = 0; i < NUM_BARS; i++) {
        const val = dataArray[i] || 0;
        const pct = Math.min(100, Math.max(5, (val / 255) * 100));
        bars[i].style.height = pct + "%";
      }
      animFrameId = requestAnimationFrame(render);
    }
    render();
  }

  async function captureMicrophone() {
    if (!localAudioStream) {
      // Mobile-compliant standard audio constraints
      localAudioStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true
        },
        video: false
      });
      initVisualizer(localAudioStream);
    }
    return localAudioStream;
  }

  // ==========================================
  // BROADCASTER WORKFLOW
  // ==========================================
  startBroadcastBtn.onclick = async () => {
    unlockAudioEngine();
    try {
      await captureMicrophone();
    } catch (e) {
      return alert("Microphone capture failed: " + e.message);
    }

    currentRoomId = "room_" + currentUser;
    activeRole = "broadcaster";
    startBroadcastBtn.disabled = true;
    muteBtn.disabled = false;
    stopSessionBtn.disabled = false;
    setStatus("live", "Broadcasting");

    await apiCall("start_broadcast", { roomId: currentRoomId });
    startBroadcasterLoop();
  };

  function startBroadcasterLoop() {
    sessionTimer = setInterval(async () => {
      // 1. Poll incoming listener requests
      const reqRes = await apiCall("poll_listen_requests", { roomId: currentRoomId });
      if (reqRes.status === "success" && reqRes.requests.length > 0) {
        renderIncomingRequests(reqRes.requests);
      }

      // 2. Poll signaling specifically addressed to broadcaster
      if (activePeerConnection && targetPeerUser) {
        const sigRes = await apiCall("poll_signaling", {
          roomId: currentRoomId,
          forUser: currentUser,
          since: lastSyncTimestamp
        });

        if (sigRes.status === "success") {
          lastSyncTimestamp = sigRes.serverTime;

          // Process SDP Answer
          if (sigRes.answer && sigRes.answer.from === targetPeerUser && activePeerConnection.signalingState === "have-local-offer") {
            await activePeerConnection.setRemoteDescription(new RTCSessionDescription(sigRes.answer.payload));
            await flushIceCandidatesQueue();
          }

          // Process ICE candidates targeting broadcaster
          if (sigRes.ice && sigRes.ice.length > 0) {
            for (const item of sigRes.ice) {
              if (item.from === targetPeerUser) {
                await processIncomingIce(item.candidate);
              }
            }
          }
        }
      }
    }, 1500);
  }

  function renderIncomingRequests(requests) {
    incomingRequestContainer.innerHTML = "";
    requests.forEach(req => {
      const banner = document.createElement("div");
      banner.className = "approval-banner";
      banner.innerHTML = `
        <span><strong>${req.listener}</strong> requests to listen.</span>
        <div class="flex-row">
          <button class="primary" style="padding: 4px 8px; font-size: 0.75rem;" onclick="handleRequestDecision('${req.listener}', '${req.roomId}', 'approved')">Approve</button>
          <button class="danger" style="padding: 4px 8px; font-size: 0.75rem;" onclick="handleRequestDecision('${req.listener}', '${req.roomId}', 'rejected')">Reject</button>
        </div>
      `;
      incomingRequestContainer.appendChild(banner);
    });
  }

  window.handleRequestDecision = async (listener, roomId, decision) => {
    unlockAudioEngine();
    incomingRequestContainer.innerHTML = "";
    await apiCall("respond_request", { roomId, toUser: listener, decision });

    if (decision === "approved") {
      targetPeerUser = listener;
      setupPeerConnection(listener, true);

      // Create Offer and dispatch targeted payload to approved listener
      const offer = await activePeerConnection.createOffer();
      await activePeerConnection.setLocalDescription(offer);
      await apiCall("post_offer", { roomId, toUser: listener, payload: offer });
    }
  };

  // ==========================================
  // LISTENER WORKFLOW
  // ==========================================
  async function fetchBroadcasts() {
    const res = await apiCall("list_broadcasts");
    if (res.status === "success") {
      if (res.broadcasts.length === 0) {
        broadcasterList.innerHTML = "<li><span>No active broadcasts</span></li>";
      } else {
        broadcasterList.innerHTML = res.broadcasts
          .filter(b => b.broadcaster !== currentUser)
          .map(b => `
            <li>
              <span>${b.broadcaster}</span>
              <button class="primary" style="padding: 4px 10px; font-size: 0.75rem;" onclick="requestListen('${b.roomId}', '${b.broadcaster}')">Request to Listen</button>
            </li>
          `).join("");
      }
    }
  }
  refreshBroadcastsBtn.onclick = fetchBroadcasts;

  window.requestListen = async (roomId, host) => {
    unlockAudioEngine();
    currentRoomId = roomId;
    targetPeerUser = host;
    activeRole = "listener";
    stopSessionBtn.disabled = false;
    startBroadcastBtn.disabled = true;
    setStatus("signaling", "Awaiting Approval");

    await apiCall("request_listen", { roomId, toUser: host });

    // Poll for approval status
    sessionTimer = setInterval(async () => {
      const res = await apiCall("check_request_status", { roomId, toUser: host });
      if (res.status === "success") {
        if (res.decision === "rejected") {
          clearInterval(sessionTimer);
          alert("Your request was declined by " + host);
          resetSessionState();
        } else if (res.decision === "approved") {
          clearInterval(sessionTimer);
          setStatus("connecting", "Approved. Connecting...");
          initiateListenerSignaling(roomId, host);
        }
      }
    }, 1500);
  };

  function initiateListenerSignaling(roomId, host) {
    setupPeerConnection(host, false);

    sessionTimer = setInterval(async () => {
      // Strictly query signaling addressed to this listener
      const sigRes = await apiCall("poll_signaling", {
        roomId,
        forUser: currentUser,
        since: lastSyncTimestamp
      });

      if (sigRes.status === "success") {
        lastSyncTimestamp = sigRes.serverTime;

        // Process SDP Offer
        if (sigRes.offer && sigRes.offer.from === host && activePeerConnection.signalingState === "stable") {
          await activePeerConnection.setRemoteDescription(new RTCSessionDescription(sigRes.offer.payload));
          await flushIceCandidatesQueue();

          const answer = await activePeerConnection.createAnswer();
          await activePeerConnection.setLocalDescription(answer);
          await apiCall("post_answer", { roomId, toUser: host, payload: answer });
        }

        // Process ICE candidates targeting this listener
        if (sigRes.ice && sigRes.ice.length > 0) {
          for (const item of sigRes.ice) {
            if (item.from === host) {
              await processIncomingIce(item.candidate);
            }
          }
        }
      }
    }, 1500);
  }

  // ==========================================
  // WEBRTC PEER CONNECTION & ICE BUFFERING
  // ==========================================
  function setupPeerConnection(remoteTarget, isBroadcaster) {
    if (activePeerConnection) activePeerConnection.close();
    activePeerConnection = new RTCPeerConnection(RTC_CONFIG);
    iceCandidatesQueue = [];

    if (isBroadcaster && localAudioStream) {
      localAudioStream.getTracks().forEach(track => {
        activePeerConnection.addTrack(track, localAudioStream);
      });
    } else {
      activePeerConnection.addTransceiver('audio', { direction: 'recvonly' });
    }

    // Robust Track Binding
    activePeerConnection.ontrack = (event) => {
      let streamToBind = null;
      if (event.streams && event.streams[0]) {
        streamToBind = event.streams[0];
      } else if (event.track) {
        streamToBind = new MediaStream([event.track]);
      }

      if (streamToBind) {
        window.remoteStream = streamToBind; // Prevent Mobile Engine GC sweep
        remoteAudio.srcObject = streamToBind;

        // Attempt playback with fallback unlock overlay
        const playPromise = remoteAudio.play();
        if (playPromise !== undefined) {
          playPromise.then(() => {
            audioUnlockBtn.classList.add("hidden");
          }).catch(err => {
            console.warn("Autoplay deferred by mobile policy:", err);
            audioUnlockBtn.classList.remove("hidden");
            audioUnlockBtn.onclick = () => {
              unlockAudioEngine();
              remoteAudio.play().then(() => {
                audioUnlockBtn.classList.add("hidden");
              });
            };
          });
        }
      }
    };

    // Forward ICE Candidates with strict routing
    activePeerConnection.onicecandidate = (event) => {
      if (event.candidate) {
        apiCall("post_ice", {
          roomId: currentRoomId,
          toUser: remoteTarget,
          payload: event.candidate
        });
      }
    };

    activePeerConnection.oniceconnectionstatechange = () => {
      const state = activePeerConnection.iceConnectionState;
      if (state === "checking") setStatus("connecting", "Negotiating...");
      if (state === "connected" || state === "completed") setStatus("live", "Live Stream");
      if (state === "disconnected" || state === "failed" || state === "closed") setStatus("", "Disconnected");
    };
  }

  async function processIncomingIce(candidate) {
    if (!activePeerConnection || !activePeerConnection.remoteDescription || !activePeerConnection.remoteDescription.type) {
      // Buffer candidates if remote description is not set yet
      iceCandidatesQueue.push(candidate);
    } else {
      try {
        await activePeerConnection.addIceCandidate(new RTCIceCandidate(candidate));
      } catch (err) {
        console.warn("ICE insertion non-fatal error:", err);
      }
    }
  }

  async function flushIceCandidatesQueue() {
    while (iceCandidatesQueue.length > 0) {
      const candidate = iceCandidatesQueue.shift();
      try {
        await activePeerConnection.addIceCandidate(new RTCIceCandidate(candidate));
      } catch (err) {
        console.warn("Queued ICE insertion non-fatal error:", err);
      }
    }
  }

  // ==========================================
  // CONTROLS & TEARDOWN
  // ==========================================
  muteBtn.onclick = () => {
    if (!localAudioStream) return;
    isMuted = !isMuted;
    localAudioStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
    muteBtn.innerText = isMuted ? "Unmute" : "Mute";
    muteBtn.className = isMuted ? "danger" : "";
  };

  stopSessionBtn.onclick = resetSessionState;

  async function resetSessionState() {
    if (sessionTimer) clearInterval(sessionTimer);
    if (animFrameId) cancelAnimationFrame(animFrameId);

    if (activeRole === "broadcaster") {
      await apiCall("stop_broadcast", { roomId: currentRoomId });
    } else {
      await apiCall("leave", { roomId: currentRoomId });
    }

    if (activePeerConnection) {
      activePeerConnection.close();
      activePeerConnection = null;
    }

    if (localAudioStream) {
      localAudioStream.getTracks().forEach(t => t.stop());
      localAudioStream = null;
    }

    window.remoteStream = null;
    iceCandidatesQueue = [];
    bars.forEach(b => b.style.height = "2px");
    audioUnlockBtn.classList.add("hidden");
    incomingRequestContainer.innerHTML = "";
    startBroadcastBtn.disabled = false;
    muteBtn.disabled = true;
    stopSessionBtn.disabled = true;
    currentRoomId = null;
    targetPeerUser = null;
    activeRole = null;
    lastSyncTimestamp = 0;
    setStatus("", currentUser);
    fetchBroadcasts();
  }
</script>
</body>
</html>
