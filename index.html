<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>P2P Direct Radio Broadcast</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --accent: #238636;
      --accent-hover: #2ea043;
      --danger: #da3633;
      --danger-hover: #f85149;
      --warn: #d29922;
      --text: #c9d1d9;
      --text-bright: #ffffff;
      --muted: #8b949e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
    .container { width: 100%; max-width: 520px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 24px; box-shadow: 0 8px 24px rgba(0,0,0,0.6); }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    h1 { font-size: 1.25rem; font-weight: 600; color: var(--text-bright); }
    .status-badge { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; text-transform: uppercase; font-weight: 700; padding: 4px 8px; border-radius: 999px; background: #21262d; border: 1px solid var(--border); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #484f58; }
    .dot.signaling { background: var(--warn); animation: pulse 1s infinite alternate; }
    .dot.connecting { background: var(--warn); animation: pulse 0.5s infinite alternate; }
    .dot.live { background: #3fb950; box-shadow: 0 0 8px #3fb950; }
    @keyframes pulse { from { opacity: 0.3; } to { opacity: 1; } }

    .card { background: #0d1117; border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .group-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; font-weight: 600; }
    .flex-row { display: flex; gap: 8px; align-items: center; }
    
    input[type="text"], input[type="password"] { flex: 1; background: #161b22; border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; color: var(--text); font-size: 0.9rem; outline: none; }
    input[type="text"]:focus, input[type="password"]:focus { border-color: #58a6ff; }

    button { background: #21262d; border: 1px solid var(--border); color: var(--text-bright); padding: 8px 14px; border-radius: 6px; font-size: 0.85rem; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: background 0.15s ease; }
    button:hover:not(:disabled) { background: #30363d; }
    button.primary { background: var(--accent); border-color: rgba(255,255,255,0.1); }
    button.primary:hover:not(:disabled) { background: var(--accent-hover); }
    button.danger { background: var(--danger); border-color: rgba(255,255,255,0.1); }
    button.danger:hover:not(:disabled) { background: var(--danger-hover); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    .visualizer-container { height: 38px; width: 100%; display: flex; align-items: flex-end; gap: 3px; margin: 10px 0; background: #010409; padding: 5px; border-radius: 6px; }
    .visualizer-bar { flex: 1; background: #238636; min-height: 2px; height: 2px; border-radius: 2px; }

    .item-list { list-style: none; font-size: 0.85rem; color: var(--muted); max-height: 180px; overflow-y: auto; }
    .item-list li { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px dotted var(--border); }
    .item-list li:last-child { border-bottom: none; }

    .audio-fallback-btn { width: 100%; background: #1f6feb; border-color: #388bfd; margin-top: 10px; padding: 10px; font-weight: bold; }
    .hidden { display: none !important; }
    .badge { background: #21262d; border: 1px solid var(--border); padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; color: var(--muted); }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>P2P Radio Station</h1>
    <div class="status-badge">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">Guest</span>
    </div>
  </header>

  <!-- Step 1: Authentication -->
  <div class="card" id="authSection">
    <div class="group-label">Authentication</div>
    <div class="flex-row" style="margin-bottom: 8px;">
      <input type="text" id="authUsername" placeholder="Username" autocomplete="off" />
      <input type="password" id="authPassword" placeholder="Password" />
    </div>
    <div class="flex-row">
      <button class="primary" id="loginBtn" style="flex: 1;">Log In</button>
      <button id="registerBtn" style="flex: 1;">Register</button>
    </div>
  </div>

  <!-- Step 2: Main Radio Deck -->
  <div id="appSection" class="hidden">
    <!-- Autoplay Bypass Unlock Button for iOS/Safari -->
    <button id="audioUnlockBtn" class="audio-fallback-btn hidden">🔇 Tap to Unmute & Listen to Audio</button>

    <!-- Broadcaster Station Controls -->
    <div class="card">
      <div class="group-label">Broadcast Station Transmitter</div>
      <div class="flex-row" style="margin-bottom: 8px;">
        <input type="text" id="stationPinInput" placeholder="Set 4-Digit Station PIN" maxlength="8" />
      </div>
      <div class="visualizer-container" id="visualizer"></div>
      <div class="flex-row">
        <button id="startBroadcastBtn" class="primary" style="flex: 1;">Go On-Air</button>
        <button id="muteBtn" disabled>Mute</button>
        <button id="stopSessionBtn" class="danger" disabled>Tune Out / Off</button>
      </div>
      <div style="margin-top: 8px; font-size: 0.75rem; color: var(--muted); display: flex; justify-content: space-between;">
        <span>Listeners Connected: <strong id="listenerCount">0</strong></span>
      </div>
    </div>

    <!-- Station Tuning Directory -->
    <div class="card">
      <div class="group-label">Active Radio Stations</div>
      <ul class="item-list" id="stationList">
        <li><span>Scanning radio frequencies...</span></li>
      </ul>
      <div style="margin-top: 8px; text-align: right;">
        <button id="refreshStationsBtn" style="font-size: 0.75rem; padding: 4px 8px;">Scan Stations</button>
      </div>
    </div>
  </div>
</div>

<!-- Native Audio Playback -->
<audio id="remoteAudio" autoplay playsinline></audio>

<script>
  /**
   * CONFIGURATION
   * Paste your published Google Apps Script Web App URL below:
   */
  const GAS_SIGNALING_URL = "https://script.google.com/macros/s/AKfycbxluLFX60cKN1ydSvbeRKzXdr7ohjhpsPBLR65vEZtxLiPRImDH6M1jlENg3ab46Ww0/exec";

  const RTC_CONFIG = {
    iceServers: [
      { urls: "stun:stun.l.google.com:19302" },
      { urls: "stun:stun1.l.google.com:19302" }
    ]
  };

  // State
  let currentUser = sessionStorage.getItem("p2p_user") || "";
  let currentPass = sessionStorage.getItem("p2p_pass") || "";
  let currentStationId = null;
  let activeRole = null; // 'broadcaster' | 'listener'
  let targetBroadcaster = null;
  
  // Broadcaster Multi-Listener Pool: { [listenerUsername]: RTCPeerConnection }
  const broadcasterPeerConnections = {};
  // Listener Single Connection: RTCPeerConnection
  let listenerPeerConnection = null;

  let localAudioStream = null;
  let audioContext = null;
  let analyserNode = null;
  let animFrameId = null;
  let pollingTimer = null;
  let lastSyncTimestamp = 0;
  let isMuted = false;

  // DOM Elements
  const statusDot = document.getElementById("statusDot");
  const statusText = document.getElementById("statusText");
  const authSection = document.getElementById("authSection");
  const appSection = document.getElementById("appSection");
  const authUsername = document.getElementById("authUsername");
  const authPassword = document.getElementById("authPassword");
  const loginBtn = document.getElementById("loginBtn");
  const registerBtn = document.getElementById("registerBtn");
  const stationPinInput = document.getElementById("stationPinInput");
  const startBroadcastBtn = document.getElementById("startBroadcastBtn");
  const muteBtn = document.getElementById("muteBtn");
  const stopSessionBtn = document.getElementById("stopSessionBtn");
  const listenerCountDisplay = document.getElementById("listenerCount");
  const stationList = document.getElementById("stationList");
  const refreshStationsBtn = document.getElementById("refreshStationsBtn");
  const audioUnlockBtn = document.getElementById("audioUnlockBtn");
  const remoteAudio = document.getElementById("remoteAudio");
  const visualizerContainer = document.getElementById("visualizer");

  // Setup Visualizer UI
  const NUM_BARS = 22;
  const bars = [];
  for (let i = 0; i < NUM_BARS; i++) {
    const b = document.createElement("div");
    b.className = "visualizer-bar";
    visualizerContainer.appendChild(b);
    bars.push(b);
  }

  function setStatus(state, text) {
    statusDot.className = "dot " + state;
    statusText.innerText = text;
  }

  // Cross-Origin Safe Signaling Client
  async function apiCall(action, payload = {}) {
    const body = {
      action,
      username: currentUser,
      password: currentPass,
      ...payload
    };

    const formData = new URLSearchParams();
    for (const key in body) {
      if (typeof body[key] === "object") {
        formData.append(key, JSON.stringify(body[key]));
      } else {
        formData.append(key, body[key] || "");
      }
    }

    try {
      const res = await fetch(GAS_SIGNALING_URL, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: formData.toString()
      });
      return await res.json();
    } catch (err) {
      console.warn("Signaling error:", err);
      return { status: "error", message: err.toString() };
    }
  }

  // Authentication Handlers
  registerBtn.onclick = async () => {
    const u = authUsername.value.trim();
    const p = authPassword.value;
    if (!u || !p) return alert("Enter both username and password.");
    registerBtn.disabled = true;
    const res = await apiCall("register", { username: u, password: p });
    registerBtn.disabled = false;
    alert(res.message);
  };

  loginBtn.onclick = async () => {
    const u = authUsername.value.trim();
    const p = authPassword.value;
    if (!u || !p) return alert("Enter username and password.");
    loginBtn.disabled = true;
    const res = await apiCall("login", { username: u, password: p });
    loginBtn.disabled = false;

    if (res.status === "success") {
      currentUser = u;
      currentPass = p;
      sessionStorage.setItem("p2p_user", u);
      sessionStorage.setItem("p2p_pass", p);
      initAppUI();
    } else {
      alert("Authentication error: " + res.message);
    }
  };

  function initAppUI() {
    authSection.classList.add("hidden");
    appSection.classList.remove("hidden");
    setStatus("", currentUser);
    fetchStations();
  }

  if (currentUser && currentPass) {
    initAppUI();
  }

  // Audio Context & Hardware Setup
  function initVisualizer(stream) {
    if (!audioContext) {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioContext.state === "suspended") {
      audioContext.resume();
    }
    analyserNode = audioContext.createAnalyser();
    analyserNode.fftSize = 64;
    const src = audioContext.createMediaStreamSource(stream);
    src.connect(analyserNode);

    const dataArray = new Uint8Array(analyserNode.frequencyBinCount);
    function render() {
      analyserNode.getByteFrequencyData(dataArray);
      for (let i = 0; i < NUM_BARS; i++) {
        const val = dataArray[i] || 0;
        const pct = Math.min(100, Math.max(5, (val / 255) * 100));
        bars[i].style.height = pct + "%";
      }
      animFrameId = requestAnimationFrame(render);
    }
    render();
  }

  async function captureMicrophone() {
    if (!localAudioStream) {
      localAudioStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
        video: false
      });
      initVisualizer(localAudioStream);
    }
    return localAudioStream;
  }

  // ==========================================
  // BROADCASTER IMPLEMENTATION (Multi-Listener Pool)
  // ==========================================
  startBroadcastBtn.onclick = async () => {
    const pin = stationPinInput.value.trim();
    if (!pin) return alert("Please enter a Station PIN for direct tuning.");

    try {
      await captureMicrophone();
    } catch (e) {
      return alert("Microphone access denied: " + e.message);
    }

    currentStationId = "station_" + currentUser;
    activeRole = "broadcaster";
    startBroadcastBtn.disabled = true;
    stationPinInput.disabled = true;
    muteBtn.disabled = false;
    stopSessionBtn.disabled = false;
    setStatus("live", "On-Air");

    await apiCall("start_station", { stationId: currentStationId, pin });
    startBroadcasterLoop();
  };

  function startBroadcasterLoop() {
    pollingTimer = setInterval(async () => {
      const res = await apiCall("poll_signaling", { stationId: currentStationId, since: lastSyncTimestamp });
      if (res.status === "success") {
        lastSyncTimestamp = res.serverTime;

        // 1. Detect New Listeners Tuning In Directly
        if (res.newListeners && res.newListeners.length > 0) {
          for (const item of res.newListeners) {
            const listener = item.listener;
            if (!broadcasterPeerConnections[listener]) {
              await setupBroadcasterPeer(listener);
            }
          }
        }

        // 2. Receive Incoming SDP Answers from Listeners
        if (res.answers && res.answers.length > 0) {
          for (const item of res.answers) {
            const pc = broadcasterPeerConnections[item.from];
            if (pc && pc.signalingState === "have-local-offer") {
              await pc.setRemoteDescription(new RTCSessionDescription(item.payload));
            }
          }
        }

        // 3. Receive ICE Candidates from Listeners
        if (res.ice && res.ice.length > 0) {
          for (const item of res.ice) {
            const pc = broadcasterPeerConnections[item.from];
            if (pc) {
              try { await pc.addIceCandidate(new RTCIceCandidate(item.candidate)); } catch (e) {}
            }
          }
        }
      }
    }, 1500);
  }

  async function setupBroadcasterPeer(listenerUser) {
    const pc = new RTCPeerConnection(RTC_CONFIG);
    broadcasterPeerConnections[listenerUser] = pc;

    // Attach broadcaster's microphone tracks to this listener connection
    if (localAudioStream) {
      localAudioStream.getTracks().forEach(track => pc.addTrack(track, localAudioStream));
    }

    // Forward ICE candidates to this listener
    pc.onicecandidate = (event) => {
      if (event.candidate) {
        apiCall("post_ice", {
          stationId: currentStationId,
          toUser: listenerUser,
          payload: event.candidate
        });
      }
    };

    pc.oniceconnectionstatechange = () => {
      if (pc.iceConnectionState === "disconnected" || pc.iceConnectionState === "failed" || pc.iceConnectionState === "closed") {
        delete broadcasterPeerConnections[listenerUser];
        updateListenerCount();
      } else if (pc.iceConnectionState === "connected" || pc.iceConnectionState === "completed") {
        updateListenerCount();
      }
    };

    // Initiate Offer directly to the authenticated listener
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await apiCall("post_offer", {
      stationId: currentStationId,
      toUser: listenerUser,
      payload: offer
    });
  }

  function updateListenerCount() {
    const count = Object.keys(broadcasterPeerConnections).length;
    listenerCountDisplay.innerText = count;
  }

  // ==========================================
  // LISTENER IMPLEMENTATION (Direct-Tune Model)
  // ==========================================
  async function fetchStations() {
    const res = await apiCall("list_stations");
    if (res.status === "success") {
      if (res.stations.length === 0) {
        stationList.innerHTML = "<li><span>No stations currently on-air</span></li>";
      } else {
        stationList.innerHTML = res.stations
          .filter(s => s.broadcaster !== currentUser)
          .map(s => `
            <li>
              <div>
                <strong>${s.broadcaster}</strong>
                <span class="badge">${s.stationId}</span>
              </div>
              <div class="flex-row">
                <input type="password" id="pin_${s.stationId}" placeholder="PIN" style="width: 80px; padding: 4px 8px; font-size: 0.8rem;" maxlength="8" />
                <button class="primary" style="padding: 4px 10px; font-size: 0.75rem;" onclick="tuneIntoStation('${s.stationId}', '${s.broadcaster}')">Tune In</button>
              </div>
            </li>
          `).join("");
      }
    }
  }
  refreshStationsBtn.onclick = fetchStations;

  window.tuneIntoStation = async (stationId, broadcaster) => {
    // 1. Synchronously unlock Mobile Safari / Chrome Audio Engine within click event
    if (!audioContext) {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioContext.state === "suspended") {
      audioContext.resume();
    }
    remoteAudio.play().catch(() => {});

    const pinField = document.getElementById(`pin_${stationId}`);
    const pin = pinField ? pinField.value.trim() : "";
    if (!pin) return alert("Please enter the Station PIN.");

    setStatus("signaling", "Tuning in...");
    const res = await apiCall("tune_in", { stationId, pin });
    if (res.status !== "success") {
      setStatus("", currentUser);
      return alert(res.message || "Could not tune in.");
    }

    currentStationId = stationId;
    targetBroadcaster = broadcaster;
    activeRole = "listener";
    stopSessionBtn.disabled = false;
    startBroadcastBtn.disabled = true;
    stationPinInput.disabled = true;

    setupListenerPeerConnection(broadcaster);
    startListenerLoop();
  };

  function setupListenerPeerConnection(broadcaster) {
    if (listenerPeerConnection) listenerPeerConnection.close();
    listenerPeerConnection = new RTCPeerConnection(RTC_CONFIG);

    // Announce audio reception intent
    listenerPeerConnection.addTransceiver('audio', { direction: 'recvonly' });

    listenerPeerConnection.ontrack = (event) => {
      if (event.streams && event.streams[0]) {
        remoteAudio.srcObject = event.streams[0];
        const playPromise = remoteAudio.play();
        if (playPromise !== undefined) {
          playPromise.then(() => {
            audioUnlockBtn.classList.add("hidden");
          }).catch(err => {
            console.warn("Autoplay policy blocked playback:", err);
            audioUnlockBtn.classList.remove("hidden");
            audioUnlockBtn.onclick = () => {
              remoteAudio.play();
              if (audioContext && audioContext.state === "suspended") audioContext.resume();
              audioUnlockBtn.classList.add("hidden");
            };
          });
        }
      }
    };

    listenerPeerConnection.onicecandidate = (event) => {
      if (event.candidate) {
        apiCall("post_ice", {
          stationId: currentStationId,
          toUser: broadcaster,
          payload: event.candidate
        });
      }
    };

    listenerPeerConnection.oniceconnectionstatechange = () => {
      const st = listenerPeerConnection.iceConnectionState;
      if (st === "checking") setStatus("connecting", "Tuning...");
      if (st === "connected" || st === "completed") setStatus("live", "Tuned In");
      if (st === "disconnected" || st === "failed" || st === "closed") setStatus("", "Disconnected");
    };
  }

  function startListenerLoop() {
    pollingTimer = setInterval(async () => {
      const res = await apiCall("poll_signaling", { stationId: currentStationId, since: lastSyncTimestamp });
      if (res.status === "success") {
        lastSyncTimestamp = res.serverTime;

        // Check for Offer from Host
        if (res.offers && res.offers.length > 0) {
          for (const item of res.offers) {
            if (item.from === targetBroadcaster && listenerPeerConnection.signalingState === "stable") {
              await listenerPeerConnection.setRemoteDescription(new RTCSessionDescription(item.payload));
              const answer = await listenerPeerConnection.createAnswer();
              await listenerPeerConnection.setLocalDescription(answer);
              await apiCall("post_answer", {
                stationId: currentStationId,
                toUser: targetBroadcaster,
                payload: answer
              });
            }
          }
        }

        // Check for ICE Candidates from Host
        if (res.ice && res.ice.length > 0) {
          for (const item of res.ice) {
            if (item.from === targetBroadcaster) {
              try { await listenerPeerConnection.addIceCandidate(new RTCIceCandidate(item.candidate)); } catch (e) {}
            }
          }
        }
      }
    }, 1500);
  }

  // Mute / Unmute
  muteBtn.onclick = () => {
    if (!localAudioStream) return;
    isMuted = !isMuted;
    localAudioStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
    muteBtn.innerText = isMuted ? "Unmute" : "Mute";
    muteBtn.className = isMuted ? "danger" : "";
  };

  // Teardown / Tune Out
  stopSessionBtn.onclick = resetSessionState;

  async function resetSessionState() {
    if (pollingTimer) clearInterval(pollingTimer);
    if (animFrameId) cancelAnimationFrame(animFrameId);

    if (activeRole === "broadcaster") {
      await apiCall("stop_station", { stationId: currentStationId });
      // Close all active listener peer connections
      Object.keys(broadcasterPeerConnections).forEach(k => {
        broadcasterPeerConnections[k].close();
        delete broadcasterPeerConnections[k];
      });
      listenerCountDisplay.innerText = "0";
    } else if (activeRole === "listener") {
      await apiCall("tune_out", { stationId: currentStationId });
      if (listenerPeerConnection) {
        listenerPeerConnection.close();
        listenerPeerConnection = null;
      }
    }

    if (localAudioStream) {
      localAudioStream.getTracks().forEach(t => t.stop());
      localAudioStream = null;
    }

    bars.forEach(b => b.style.height = "2px");
    audioUnlockBtn.classList.add("hidden");
    startBroadcastBtn.disabled = false;
    stationPinInput.disabled = false;
    muteBtn.disabled = true;
    stopSessionBtn.disabled = true;
    currentStationId = null;
    targetBroadcaster = null;
    activeRole = null;
    lastSyncTimestamp = 0;
    setStatus("", currentUser);
    fetchStations();
  }
</script>
</body>
</html>
